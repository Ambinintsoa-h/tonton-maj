<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Suppresseur d'AbortError — doit être chargé AVANT tout bundle webpack/CRA.
      CRA enregistre son overlay unhandledrejection via HMR avant index.js.
      On utilise capture:true pour s'intercaler en phase de capture, avant CRA.
      stopImmediatePropagation() empêche le handler bubble de CRA de s'exécuter.
      Ces erreurs (AbortError, CanceledError) sont déjà gérées dans les .catch()
      du code applicatif — les afficher dans l'overlay est un faux positif.
    -->
    <!--
      Suppresseur de ResizeObserver — doit être chargé AVANT tout bundle webpack/CRA.
      Framer Motion déclenche "ResizeObserver loop completed with undelivered notifications"
      pendant ses animations — c'est un comportement navigateur bénin, pas une vraie erreur.
      On coupe les deux canaux (window.onerror + capture phase) avant que CRA puisse
      enregistrer son propre handler et afficher l'overlay rouge.
    -->
    <script>
      (function () {
        var _onerror = window.onerror;
        window.onerror = function (msg) {
          if (typeof msg === 'string' && msg.indexOf('ResizeObserver loop') !== -1) return true;
          return _onerror ? _onerror.apply(this, arguments) : false;
        };
        window.addEventListener('error', function (e) {
          if (e.message && e.message.indexOf('ResizeObserver loop') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <script>
      (function () {
        function isAbortLike(reason) {
          if (!reason) return false;
          var n = reason.name || '';
          var m = (reason.message || '').toLowerCase();
          var c = reason.code || '';
          return (
            n === 'AbortError' ||
            n === 'CanceledError' ||
            c === 'ERR_CANCELED' ||
            m === 'canceled' ||
            m.indexOf('aborted') !== -1 ||
            m.indexOf('abort') !== -1 ||
            m.indexOf('cancel') !== -1
          );
        }
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (isAbortLike(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true   /* capture phase — s'exécute avant les handlers bubble de CRA */
        );
      })();
    </script>
    <link rel="icon" id="favicon" href="%PUBLIC_URL%/tonton.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Mise à jour d'article avec l'agent IA TONTON"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/tonton.jpg" />
    <script>
      /* Favicon crop — reproduit objectPosition:'50% 18%' + objectFit:'cover'
         pour cadrer sur le visage de TONTON AI comme dans la sidebar.        */
      (function() {
        var img = new Image();
        img.onload = function() {
          var size = 64;
          var c = document.createElement('canvas');
          c.width = c.height = size;
          var ctx = c.getContext('2d');
          /* Arrondi compatible tous navigateurs */
          var r = size * 0.22;
          ctx.beginPath();
          ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
          ctx.quadraticCurveTo(size, 0, size, r);
          ctx.lineTo(size, size - r);
          ctx.quadraticCurveTo(size, size, size - r, size);
          ctx.lineTo(r, size); ctx.quadraticCurveTo(0, size, 0, size - r);
          ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
          ctx.closePath(); ctx.clip();
          /* Cover + objectPosition 50% 18% */
          var scale = Math.max(size / img.naturalWidth, size / img.naturalHeight);
          var w = img.naturalWidth  * scale;
          var h = img.naturalHeight * scale;
          var x = (size - w) * 0.50; /* centré horizontalement */
          var y = (size - h) * 0.18; /* 18 % depuis le haut → visage */
          ctx.drawImage(img, x, y, w, h);
          var link = document.getElementById('favicon');
          if (link) link.href = c.toDataURL('image/png');
        };
        img.src = '/tonton.jpg';
      })();
    </script>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>TONTON AI — Mise à jour d'articles par IA</title>

    <!-- ── Splash screen TONTON AI ────────────────────────────────────────────
         S'affiche immédiatement, avant que le bundle React soit évalué.
         Retiré par App.js via __tontonBootstrapPromise une fois Firebase prêt.
    ──────────────────────────────────────────────────────────────────────── -->
    <style>
      /* ── Fond ── */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0c0c0c;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }
      #app-loader.fade-out { opacity: 0; pointer-events: none; }

      /* Orbes de fond animés */
      #app-loader .al-orb1,
      #app-loader .al-orb2 {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
      }
      #app-loader .al-orb1 {
        width: 420px; height: 420px;
        top: -120px; left: -120px;
        background: radial-gradient(circle, rgba(255,255,255,0.045) 0%, transparent 70%);
        animation: al-orb1 9s ease-in-out infinite;
      }
      #app-loader .al-orb2 {
        width: 360px; height: 360px;
        bottom: -100px; right: -100px;
        background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
        animation: al-orb2 12s ease-in-out infinite;
      }
      @keyframes al-orb1 {
        0%,100% { transform: translate(0,0) scale(1); }
        50%      { transform: translate(40px,30px) scale(1.1); }
      }
      @keyframes al-orb2 {
        0%,100% { transform: translate(0,0) scale(1); }
        50%      { transform: translate(-30px,-25px) scale(1.08); }
      }

      /* ── Carte glassmorphisme ── */
      #app-loader .al-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 44px 52px 40px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 28px;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow:
          0 32px 80px rgba(0,0,0,0.7),
          0 0 0 1px rgba(255,255,255,0.04) inset,
          0 1px 0 rgba(255,255,255,0.1) inset;
        animation: al-card-in 0.7s cubic-bezier(0.34,1.4,0.64,1) both;
      }
      @keyframes al-card-in {
        from { opacity: 0; transform: translateY(18px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0)    scale(1);    }
      }

      /* ── Avatar + rings ── */
      #app-loader .al-avatar-wrap {
        position: relative;
        width: 116px;
        height: 116px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Ring externe (rotation horaire) */
      #app-loader .al-ring-outer {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        border-top-color: rgba(255,255,255,0.55);
        border-right-color: rgba(255,255,255,0.18);
        animation: al-cw 2.2s linear infinite;
      }
      /* Ring intermédiaire (rotation anti-horaire) */
      #app-loader .al-ring-mid {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-bottom-color: rgba(255,255,255,0.45);
        border-left-color: rgba(255,255,255,0.14);
        animation: al-ccw 1.6s linear infinite;
      }
      /* Ring interne (rotation horaire, lent) */
      #app-loader .al-ring-inner {
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: rgba(255,255,255,0.2);
        animation: al-cw 3.5s linear infinite;
      }

      @keyframes al-cw  { to { transform: rotate(360deg);  } }
      @keyframes al-ccw { to { transform: rotate(-360deg); } }

      /* Photo avatar */
      #app-loader .al-avatar-wrap img {
        width: 116px;
        height: 116px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(255,255,255,0.12);
        box-shadow:
          0 0 0 5px rgba(255,255,255,0.05),
          0 12px 40px rgba(0,0,0,0.6);
        animation: al-breathe 3.5s ease-in-out infinite;
      }
      @keyframes al-breathe {
        0%,100% { box-shadow: 0 0 0 5px rgba(255,255,255,0.05), 0 12px 40px rgba(0,0,0,0.6); }
        50%      { box-shadow: 0 0 0 9px rgba(255,255,255,0.09), 0 16px 48px rgba(0,0,0,0.65); }
      }

      /* ── Texte ── */
      #app-loader .al-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
      }
      #app-loader .al-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
        font-size: 27px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.9px;
        line-height: 1;
      }
      #app-loader .al-title span {
        color: rgba(255,255,255,0.38);
        font-weight: 700;
      }
      #app-loader .al-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
        font-size: 10px;
        font-weight: 600;
        color: rgba(255,255,255,0.28);
        letter-spacing: 2.8px;
        text-transform: uppercase;
      }

      /* ── Progress shimmer ── */
      #app-loader .al-progress {
        width: 148px;
        height: 2px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      #app-loader .al-progress::after {
        content: '';
        position: absolute;
        top: 0; left: -50%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent);
        animation: al-shimmer 1.8s ease-in-out infinite;
      }
      @keyframes al-shimmer {
        0%   { left: -50%; }
        100% { left: 110%; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Splash screen — retiré par App.js via window.__tontonBootstrapPromise -->
    <div id="app-loader">
      <div class="al-orb1"></div>
      <div class="al-orb2"></div>
      <div class="al-card">
        <div class="al-avatar-wrap">
          <div class="al-ring-outer"></div>
          <div class="al-ring-mid"></div>
          <div class="al-ring-inner"></div>
          <img src="%PUBLIC_URL%/tonton.jpg" alt="TONTON AI" />
        </div>
        <div class="al-text">
          <div class="al-title">TONTON <span>AI</span></div>
          <div class="al-subtitle">Mise à jour d'articles</div>
        </div>
        <div class="al-progress"></div>
      </div>
    </div>

    <div id="root"></div>

  </body>
</html>
