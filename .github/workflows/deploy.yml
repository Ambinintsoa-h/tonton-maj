name: Deploy to n0c

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          GENERATE_SOURCEMAP: false
          CI: false

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.N0C_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << EOF
          Host n0c
            HostName ${{ secrets.N0C_HOST }}
            Port ${{ secrets.N0C_PORT }}
            User ${{ secrets.N0C_USERNAME }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ConnectTimeout 60
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

      - name: Upload files via SCP
        run: |
          ok=0
          for attempt in 1 2 3; do
            echo "Tentative SCP $attempt/3..."
            scp -F ~/.ssh/config \
              proxy.js data-api.js db.js crypto-util.js package.json package-lock.json \
              n0c:~/maj.stomos.net/ && \
            scp -F ~/.ssh/config -r build \
              n0c:~/maj.stomos.net/ && { ok=1; break; }
            echo "Échec tentative $attempt, attente 15s..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::SCP échoué après 3 tentatives — n0c injoignable depuis GitHub Actions."
            exit 1
          fi

      - name: Install deps + restart sur n0c
        run: |
          REMOTE_CMD='set -e
          source ~/nodevenv/maj.stomos.net/22/bin/activate
          cd ~/maj.stomos.net
          npm install --omit=dev
          mkdir -p data
          chmod -R 755 build/
          cp -rv build/* public/
          touch tmp/restart.txt
          echo "Déploiement terminé"'

          ok=0
          for attempt in 1 2 3; do
            echo "Tentative SSH $attempt/3..."
            ssh -F ~/.ssh/config n0c bash -s <<< "$REMOTE_CMD" && { echo "SSH OK"; ok=1; break; }
            echo "Échec tentative $attempt, attente 20s..."
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::SSH/restart échoué après 3 tentatives — n0c injoignable depuis GitHub Actions."
            exit 1
          fi

      # Sans ce contrôle, le workflow passait au vert alors que l'application ne
      # démarrait plus (Passenger « Web application could not be started ») : SCP et
      # SSH réussissent, mais rien ne vérifiait que le proxy répond.
      - name: Contrôle de santé (l'application répond-elle ?)
        run: |
          code=000
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://maj.stomos.net/api/backend || echo 000)
            echo "Tentative $attempt/6 : HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Application en ligne."
              exit 0
            fi
            sleep 10
          done
          echo "::error::L'application ne répond pas (dernier code HTTP : $code). Les fichiers sont déployés mais le proxy ne démarre pas — consulter stderr.log sur n0c."
          exit 1
