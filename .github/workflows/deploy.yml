name: Deploy to n0c

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          GENERATE_SOURCEMAP: false
          CI: false

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.N0C_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << EOF
          Host n0c
            HostName ${{ secrets.N0C_HOST }}
            Port ${{ secrets.N0C_PORT }}
            User ${{ secrets.N0C_USERNAME }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ConnectTimeout 30
          EOF

      - name: Upload files via SCP
        run: |
          scp -F ~/.ssh/config \
            proxy.js package.json package-lock.json \
            n0c:~/maj.stomos.net/
          scp -F ~/.ssh/config -r build \
            n0c:~/maj.stomos.net/

      - name: Install deps + restart sur n0c
        run: |
          ssh -F ~/.ssh/config n0c bash << 'SCRIPT'
            set -e
            source ~/nodevenv/maj.stomos.net/22/bin/activate
            cd ~/maj.stomos.net
            npm install --omit=dev
            mkdir -p data
            chmod -R 755 build/
            cp -rv build/* public/
            touch tmp/restart.txt
            echo "Déploiement terminé"
          SCRIPT
