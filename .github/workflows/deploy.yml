name: Deploy to n0c

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          GENERATE_SOURCEMAP: false
          CI: false

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.N0C_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p ${{ secrets.N0C_PORT }} ${{ secrets.N0C_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload files via SCP
        run: |
          scp -P ${{ secrets.N0C_PORT }} -i ~/.ssh/id_rsa -r \
            proxy.js package.json package-lock.json build \
            ${{ secrets.N0C_USERNAME }}@${{ secrets.N0C_HOST }}:~/maj.stomos.net/

      - name: Install deps + restart sur n0c
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.N0C_HOST }}
          username: ${{ secrets.N0C_USERNAME }}
          key: ${{ secrets.N0C_DEPLOY_KEY }}
          port: ${{ secrets.N0C_PORT }}
          script: |
            source ~/nodevenv/maj.stomos.net/22/bin/activate
            cd ~/maj.stomos.net
            npm install --omit=dev
            mkdir -p data
            chmod -R 755 build/
            cp -rv build/* public/
            touch tmp/restart.txt
            echo "✅ Déploiement terminé"
