name: Deploy to n0c

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          GENERATE_SOURCEMAP: false
          CI: false

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.N0C_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p ${{ secrets.N0C_PORT }} ${{ secrets.N0C_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload files via SCP
        run: |
          scp -P ${{ secrets.N0C_PORT }} -i ~/.ssh/id_rsa \
            proxy.js package.json package-lock.json \
            ${{ secrets.N0C_USERNAME }}@${{ secrets.N0C_HOST }}:~/maj.stomos.net/
          scp -P ${{ secrets.N0C_PORT }} -i ~/.ssh/id_rsa -r \
            build \
            ${{ secrets.N0C_USERNAME }}@${{ secrets.N0C_HOST }}:~/maj.stomos.net/

      - name: Install deps + restart sur n0c
        run: |
          ssh -p ${{ secrets.N0C_PORT }} -i ~/.ssh/id_rsa \
            ${{ secrets.N0C_USERNAME }}@${{ secrets.N0C_HOST }} << 'ENDSSH'
          source ~/nodevenv/maj.stomos.net/22/bin/activate
          cd ~/maj.stomos.net
          npm install --omit=dev
          mkdir -p data
          chmod -R 755 build/
          cp -rv build/* public/
          touch tmp/restart.txt
          echo "✅ Déploiement terminé"
          ENDSSH
