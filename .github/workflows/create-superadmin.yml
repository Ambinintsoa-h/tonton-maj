name: Create super admin

# Crée (ou promeut) un compte SUPER ADMIN Firebase depuis le serveur n0c :
#   Auth (mot de passe aléatoire jamais affiché) + custom claims {role, username}
#   + fiche Firestore users + email d'invitation avec lien de définition du
#   mot de passe (SMTP du serveur — data/settings.json).
#
# Sécurité :
#   - Déclenchement MANUEL uniquement (workflow_dispatch) → réservé aux membres
#     du dépôt avec accès en écriture, même si le dépôt est public.
#   - Aucun secret ni lien de réinitialisation dans les logs : le lien part
#     UNIQUEMENT par email au destinataire.
#   - Le script temporaire est supprimé du serveur après exécution.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du nouveau super admin"
        required: true
        type: string
      username:
        description: "Identifiant de connexion (lettres, chiffres, . _ -)"
        required: true
        type: string

jobs:
  create-superadmin:
    runs-on: ubuntu-latest

    steps:
      - name: Écrire le script d'administration
        run: |
          cat > create-superadmin-tmp.cjs <<'EOF'
          const admin = require('firebase-admin');
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const nodemailer = require('nodemailer');

          const email = (process.env.NEW_ADMIN_EMAIL || '').trim().toLowerCase();
          const username = (process.env.NEW_ADMIN_USERNAME || '').trim();

          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { console.error('Email invalide'); process.exit(1); }
          if (!/^[a-zA-Z0-9._-]{1,64}$/.test(username)) { console.error('Username invalide (lettres, chiffres, . _ - ; 1-64)'); process.exit(1); }

          const sa = JSON.parse(fs.readFileSync(path.join(__dirname, 'data', 'firebase-service-account.json'), 'utf8'));
          admin.initializeApp({ credential: admin.credential.cert(sa) });
          const db = admin.firestore();

          (async () => {
            // Username déjà pris par un AUTRE compte ? (même règle que /api/users/create)
            const clash = await db.collection('users').where('username', '==', username).limit(1).get();
            if (!clash.empty && clash.docs[0].data().email !== email) {
              console.error('Username déjà utilisé par un autre membre — choisissez-en un autre');
              process.exit(1);
            }

            // Créer le compte Auth — ou réutiliser un compte existant pour cet email
            let user;
            const password = crypto.randomBytes(32).toString('hex'); // jamais affiché
            try {
              user = await admin.auth().createUser({ email, password, displayName: username });
              console.log('Compte Firebase Auth créé');
            } catch (e) {
              if (e.code !== 'auth/email-already-exists') throw e;
              user = await admin.auth().getUserByEmail(email);
              console.log('Compte Firebase Auth existant réutilisé (promotion super_admin)');
            }

            await admin.auth().setCustomUserClaims(user.uid, { role: 'super_admin', username });
            await db.collection('users').doc(user.uid).set({
              uid: user.uid, username, email,
              role: 'super_admin', status: 'active',
            }, { merge: true });
            const docSnap = await db.collection('users').doc(user.uid).get();
            if (!docSnap.data().createdAt) await db.collection('users').doc(user.uid).update({ createdAt: Date.now() });
            console.log('Claims super_admin + fiche Firestore OK');

            // Lien de définition du mot de passe → envoyé UNIQUEMENT par email
            const resetLink = await admin.auth().generatePasswordResetLink(email, {
              url: 'https://maj.stomos.net/reset-password',
            });
            const s = JSON.parse(fs.readFileSync(path.join(__dirname, 'data', 'settings.json'), 'utf8'));
            if (!s.smtpHost || !s.smtpUser || !s.smtpPass) {
              console.error('SMTP non configuré sur le serveur — impossible d\'envoyer l\'invitation.');
              console.error('Le compte est créé : utilisez « Mot de passe oublié » sur la page de connexion pour définir le mot de passe.');
              process.exit(0);
            }
            const transporter = nodemailer.createTransport({
              host: s.smtpHost, port: s.smtpPort || 587, secure: (s.smtpPort || 587) === 465,
              auth: { user: s.smtpUser, pass: s.smtpPass },
            });
            await transporter.sendMail({
              from: s.smtpFrom || s.smtpUser,
              to: email,
              subject: 'TONTON AI — Votre accès super administrateur',
              text: [
                'Bonjour,',
                '',
                'Votre compte SUPER ADMIN TONTON AI a été créé.',
                `  Identifiant : ${username}`,
                `  Définissez votre mot de passe : ${resetLink}`,
                '',
                'Connectez-vous ensuite ici : https://maj.stomos.net',
                '',
                "L'équipe PUBLITHINGS",
              ].join('\n'),
            });
            console.log('Invitation envoyée à ' + email);
          })().catch(e => { console.error('ERREUR : ' + e.message); process.exit(1); });
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.N0C_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << EOF
          Host n0c
            HostName ${{ secrets.N0C_HOST }}
            Port ${{ secrets.N0C_PORT }}
            User ${{ secrets.N0C_USERNAME }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ConnectTimeout 60
          EOF

      - name: Exécuter sur n0c
        env:
          NEW_ADMIN_EMAIL: ${{ inputs.email }}
          NEW_ADMIN_USERNAME: ${{ inputs.username }}
        run: |
          scp -F ~/.ssh/config create-superadmin-tmp.cjs n0c:~/maj.stomos.net/
          ssh -F ~/.ssh/config n0c bash -s -- "$NEW_ADMIN_EMAIL" "$NEW_ADMIN_USERNAME" << 'REMOTE'
          set -e
          source ~/nodevenv/maj.stomos.net/22/bin/activate
          cd ~/maj.stomos.net
          NEW_ADMIN_EMAIL="$1" NEW_ADMIN_USERNAME="$2" node create-superadmin-tmp.cjs
          rm -f create-superadmin-tmp.cjs
          REMOTE

      - name: Nettoyage même en cas d'échec
        if: always()
        run: |
          ssh -F ~/.ssh/config n0c "rm -f ~/maj.stomos.net/create-superadmin-tmp.cjs" || true
