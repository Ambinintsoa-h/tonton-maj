name: Delete admin account

# Supprime PROPREMENT un compte membre créé pour test : compte Firebase Auth,
# fiche Firestore `users`, et ses docs de suivi `article_time`.
# Déclenchement MANUEL uniquement (membres du dépôt avec accès en écriture).
# Workflow éphémère : à retirer du dépôt après usage.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte à supprimer"
        required: true
        type: string

jobs:
  delete-account:
    runs-on: ubuntu-latest

    steps:
      - name: Écrire le script de suppression
        run: |
          cat > delete-account-tmp.cjs <<'EOF'
          const admin = require('firebase-admin');
          const fs = require('fs');
          const path = require('path');

          const email = (process.env.TARGET_EMAIL || '').trim().toLowerCase();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { console.error('Email invalide'); process.exit(1); }

          const sa = JSON.parse(fs.readFileSync(path.join(__dirname, 'data', 'firebase-service-account.json'), 'utf8'));
          admin.initializeApp({ credential: admin.credential.cert(sa) });
          const db = admin.firestore();

          (async () => {
            let user;
            try { user = await admin.auth().getUserByEmail(email); }
            catch (e) {
              if (e.code === 'auth/user-not-found') { console.log('Compte deja absent — rien a supprimer'); process.exit(0); }
              throw e;
            }
            const uid = user.uid;
            // Docs de suivi du temps de ce compte
            const at = await db.collection('article_time').where('userId', '==', uid).get();
            for (const d of at.docs) await d.ref.delete();
            // Fiche annuaire
            await db.collection('users').doc(uid).delete();
            // Compte Auth
            await admin.auth().deleteUser(uid);
            console.log('Compte supprime (Auth + fiche users + ' + at.size + ' doc(s) article_time)');
          })().catch(e => { console.error('ERREUR : ' + e.message); process.exit(1); });
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.N0C_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << EOF
          Host n0c
            HostName ${{ secrets.N0C_HOST }}
            Port ${{ secrets.N0C_PORT }}
            User ${{ secrets.N0C_USERNAME }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ConnectTimeout 60
          EOF

      - name: Exécuter sur n0c
        env:
          TARGET_EMAIL: ${{ inputs.email }}
        run: |
          scp -F ~/.ssh/config delete-account-tmp.cjs n0c:~/maj.stomos.net/
          ssh -F ~/.ssh/config n0c bash -s -- "$TARGET_EMAIL" << 'REMOTE'
          set -e
          source ~/nodevenv/maj.stomos.net/22/bin/activate
          cd ~/maj.stomos.net
          TARGET_EMAIL="$1" node delete-account-tmp.cjs
          rm -f delete-account-tmp.cjs
          REMOTE

      - name: Nettoyage même en cas d'échec
        if: always()
        run: |
          ssh -F ~/.ssh/config n0c "rm -f ~/maj.stomos.net/delete-account-tmp.cjs" || true
